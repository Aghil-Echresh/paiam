<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">

  <title>پیام به سوپرمارکت کمیل</title>

  <style>
    :root {
      --bg1: #020617;
      --bg2: #0f172a;
      --card: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent2: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family:
        Tahoma,
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(rgba(2,6,23,.28), rgba(2,6,23,.45)),
        url("./background.webp") center center / cover fixed no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 2;
    }

    .store-photo {
      display: none;
    }

    .card {
      position: relative;
      overflow: hidden;

      background: rgba(8,15,30,.48);
      border: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-radius: 32px;
      padding: 30px 22px;

      text-align: center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .card::before {
      content: "";
      position: absolute;

      width: 180px;
      height: 180px;

      background: rgba(34,197,94,.12);
      border-radius: 50%;

      top: -90px;
      right: -70px;

      filter: blur(10px);
    }

    .brand {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      margin-bottom: 22px;
    }

    .logo {
      width: 62px;
      height: 62px;

      border-radius: 19px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;

      background:
        linear-gradient(145deg, #22c55e, #15803d);

      box-shadow:
        0 10px 25px rgba(34,197,94,.25);
    }

    .brand-text {
      text-align: right;
    }

    .brand-text h1 {
      margin: 0;

      font-size: 21px;
      font-weight: 800;
    }

    .brand-text p {
      margin: 5px 0 0;

      color: var(--muted);
      font-size: 12px;
    }

    .title {
      position: relative;
      z-index: 2;

      font-size: 25px;
      margin: 8px 0 8px;

      font-weight: 900;
    }

    .description {
      position: relative;
      z-index: 2;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.9;

      margin-bottom: 24px;
    }

    .qr-wrapper {
      position: relative;
      z-index: 2;

      width: 292px;
      height: 292px;

      max-width: 100%;

      margin: 0 auto 22px;

      padding: 16px;

      background: #fff;

      border-radius: 26px;

      box-shadow:
        0 20px 50px rgba(0,0,0,.35);
    }

    #qrcode {
      width: 100%;
      height: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img,
    #qrcode canvas {
      width: 100% !important;
      height: 100% !important;

      display: block;
    }

    .scan-label {
      position: relative;
      z-index: 2;

      display: inline-flex;
      align-items: center;

      gap: 7px;

      padding: 8px 13px;

      border-radius: 999px;

      background: rgba(34,197,94,.10);
      border: 1px solid rgba(34,197,94,.18);

      color: #86efac;

      font-size: 12px;

      margin-bottom: 17px;
    }

    .phone {
      position: relative;
      z-index: 2;

      direction: ltr;

      display: block;

      width: 100%;

      padding: 13px;

      border-radius: 15px;

      background: rgba(0,0,0,.20);
      border: 1px solid var(--border);

      color: #e2e8f0;

      font-size: 15px;
      font-weight: 700;

      letter-spacing: .5px;

      margin-bottom: 17px;
    }

    .buttons {
      position: relative;
      z-index: 2;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    button {
      border: none;

      border-radius: 15px;

      padding: 14px 10px;

      font-family: inherit;

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;
    }

    button:active {
      transform: scale(.96);
    }

    .primary {
      color: white;

      background:
        linear-gradient(135deg, var(--accent), var(--accent2));

      box-shadow:
        0 10px 25px rgba(34,197,94,.20);
    }

    .secondary {
      color: #e2e8f0;

      background: rgba(255,255,255,.08);

      border: 1px solid var(--border);
    }

    .footer {
      position: relative;
      z-index: 2;

      margin-top: 22px;

      color: #64748b;

      font-size: 11px;
      line-height: 1.8;
    }

    .footer strong {
      color: #94a3b8;
    }

    @media (max-width: 380px) {

      .card {
        padding: 24px 16px;
        border-radius: 27px;
      }

      .qr-wrapper {
        width: 250px;
        height: 250px;
      }

      .title {
        font-size: 22px;
      }
    }

    @media print {

      body {
        background: white;
        color: black;
        padding: 0;
      }

      .card {
        box-shadow: none;
        background: white;
        border: none;
      }

      .title,
      .brand-text h1,
      .phone {
        color: black;
      }

      .description,
      .footer {
        color: #444;
      }

      .buttons,
      .scan-label {
        display: none;
      }

      .qr-wrapper {
        box-shadow: none;
      }
    }
  
    /* نسخه دسکتاپ */
    @media (min-width: 900px) {
      .store-photo {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
        background: url("./background.webp") center center / cover no-repeat;
        filter: saturate(1.05) contrast(1.02);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        background: linear-gradient(90deg, rgba(2,6,23,.22), rgba(2,6,23,.55));
        pointer-events: none;
      }
      body {
        padding: 40px;
        background-attachment: fixed;
      }

      .container {
        max-width: 1080px;
      }

      .card {
        min-height: 620px;
        padding: 42px 48px;
        border-radius: 38px;
        display: grid;
        grid-template-columns: 430px 1fr;
        grid-template-areas:
          "brand brand"
          "qr content"
          "qr buttons"
          "qr footer";
        column-gap: 54px;
        row-gap: 12px;
        align-items: center;
        text-align: right;
      }

      .brand {
        grid-area: brand;
        justify-content: flex-start;
        margin-bottom: 12px;
      }

      .title {
        grid-area: content;
        margin: 0;
        font-size: 34px;
      }

      .description {
        grid-area: content;
        margin: 52px 0 0;
        max-width: 560px;
        font-size: 16px;
      }

      .qr-wrapper {
        grid-area: qr;
        width: 390px;
        height: 390px;
        padding: 18px;
        margin: 0 auto;
      }

      .scan-label {
        position: absolute;
        right: 48px;
        top: 152px;
        margin: 0;
      }

      .phone {
        grid-area: content;
        width: min(100%, 560px);
        margin: 118px 0 0;
        font-size: 18px;
        padding: 16px;
      }

      .buttons {
        grid-area: buttons;
        width: min(100%, 560px);
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        align-self: start;
      }

      button {
        min-height: 52px;
        font-size: 14px;
      }

      .footer {
        grid-area: footer;
        margin: 0;
        width: min(100%, 560px);
        font-size: 12px;
      }
    }

    @media (min-width: 1200px) {
      .card {
        grid-template-columns: 470px 1fr;
        column-gap: 70px;
        padding: 50px 60px;
      }

      .qr-wrapper {
        width: 430px;
        height: 430px;
      }

      .scan-label {
        right: 60px;
        top: 160px;
      }
    }

  </style>
</head>

<body>

  <div class="store-photo" aria-label="تصویر سوپرمارکت کمیل"></div>

  <main class="container">

    <section class="card">

      <div class="brand">

        <div class="logo">
          🛒
        </div>

        <div class="brand-text">
          <h1>سوپرمارکت کمیل</h1>
          <p>همیشه در خدمت شما</p>
        </div>

      </div>

      <h2 class="title">
        پیام مستقیم
      </h2>

      <p class="description">
        دوربین گوشی را روی QR Code بگیرید
        تا برنامه پیامک باز شود.
      </p>

      <div class="qr-wrapper">
        <div id="qrcode"></div>
      </div>

      <div class="scan-label">
        📱 اسکن کنید و پیام بدهید
      </div>

      <div class="phone">
        +98 903 063 5648
      </div>

      <div class="buttons">

        <button class="primary" onclick="openSMS()">
          ✉️ ارسال پیام
        </button>

        <button class="secondary" onclick="downloadQR()">
          📥 دانلود QR
        </button>

        <button class="secondary" onclick="window.print()">
          🖨️ چاپ QR
        </button>

        <button class="secondary" onclick="copyNumber()">
          📋 کپی شماره
        </button>

      </div>

      <div class="footer">
        با احترام، <strong>سوپرمارکت کمیل</strong> ❤️
      </div>

    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>

    const phoneNumber = "+989030635648";

    const smsLink = "sms:" + phoneNumber;

    new QRCode(document.getElementById("qrcode"), {
      text: smsLink,
      width: 260,
      height: 260,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    function openSMS() {
      window.location.href = smsLink;
    }

    function downloadQR() {
      const img = document.querySelector("#qrcode img");

      if (!img) {
        alert("QR Code هنوز آماده نشده است.");
        return;
      }

      const link = document.createElement("a");

      link.href = img.src;
      link.download = "QR-SMS-Supermarket-Kamil.png";

      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function copyNumber() {
      try {
        await navigator.clipboard.writeText(phoneNumber);
        alert("شماره کپی شد ✅");
      } catch (error) {
        alert("کپی شماره انجام نشد.");
      }
    }

  </script>

</body>
</html>
